<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a0f"><meta name="description" content="Create a Bookable263 artist, manager or organizer account."><title>Create account · Bookable263</title><link rel="stylesheet" href="/styles.css"></head><body data-page="register"><div id="site-header"></div><main id="page-content" class="page-wrap auth-page"><section class="auth-card"><div class="eyebrow">JOIN THE NETWORK</div><h1>Create your account</h1><p>Build your professional presence or start planning your next event.</p><form id="register-form"><label>Full name<input name="name" autocomplete="name" minlength="2" maxlength="80" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="new-password" minlength="12" required><span class="form-hint">Use at least 12 characters.</span></label><fieldset class="role-options"><legend>What brings you here? <span>Optional</span></legend><label><input type="checkbox" name="roles" value="artist"> Artist or performer</label><label><input type="checkbox" name="roles" value="manager"> Manager or agency</label><label><input type="checkbox" name="roles" value="organizer"> Event organizer</label><label><input type="checkbox" name="roles" value="venue_staff"> Venue team</label><small>These describe your interests. Organization permissions are granted separately.</small></fieldset><button class="button full">Create account</button><p id="auth-error" class="form-error" role="alert"></p></form><p class="auth-switch">Already have an account? <a href="/sign-in">Sign in</a></p></section></main><div id="site-footer"></div><div id="cookie-layer"></div><div id="toast" class="toast" role="status" aria-live="polite"></div><script src="/pages.js" defer></script></body></html>
